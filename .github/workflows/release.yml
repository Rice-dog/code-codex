name: Release package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v
        required: true
        default: 0.1.20
permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/explorer-ui/package-lock.json
            demo-video/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $value = $env:DISPATCH_VERSION
          } else {
            if ($env:REF_NAME -notmatch '^v((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))$') {
              throw "Release tags must be an exact v-prefixed numeric version: $env:REF_NAME"
            }
            $value = $Matches[1]
          }
          if ($value -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Release version must contain exactly three numeric parts: $value"
          }
          "value=$value" >> $env:GITHUB_OUTPUT

      - name: Verify
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Package release artifacts
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: ./scripts/package.ps1 -Version $env:RELEASE_VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.value }}
          path: artifacts/*
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            artifacts/*.zip
            artifacts/*-setup.exe
            artifacts/*.msi
            artifacts/SHA256SUMS.txt
            artifacts/sbom.spdx.json
            artifacts/THIRD_PARTY.md
            artifacts/THIRD_PARTY_LICENSES.txt
            artifacts/CodeCodex-*-demo.mp4
          body: |
            > [!WARNING]
            > The executables and MSI in this release are unsigned. Verify the published SHA-256 checksums before running them; Windows may show an unknown-publisher warning.
          generate_release_notes: true
