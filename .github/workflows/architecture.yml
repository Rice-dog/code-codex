name: Architecture and contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native-protocol:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p cdp-client --locked -- --test-threads=1
  startup-recovery-native:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/explorer-ui/package-lock.json
      - name: Update the native Rust toolchain
        run: rustup update stable --no-self-update
      - run: npm --prefix packages/explorer-ui ci
      - run: npm --prefix packages/explorer-ui run build
      - name: Build the embedded native launcher (never installs or activates Codex)
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release -SkipUi
      - name: Native recovery protocol and process-identity unit tests
        run: |
          cargo test --release --locked -p code-codex --bin code-codex startup_conflict:: -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release --locked -p code-codex --bin code-codex login_startup -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release --locked -p code-codex --bin code-codex tests::automatic_restart_permission_has_an_explicit_reset_command -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release --locked -p code-codex --bin code-codex tests::user_visible_launcher_failures_have_stable_exit_categories -- --exact
      - name: Recovery decisions and preference-persistence failures
        run: powershell -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File scripts/test-startup-conflict.ps1 -RequireNative
      - name: Compiled CLI and embedded worker transport
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test-startup-conflict-native.ps1
      - name: Disposable visible, hidden, multiple, modal and veto windows
        run: powershell -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File scripts/test-startup-conflict-windows.ps1
  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/explorer-ui/package-lock.json
      - run: npm --prefix packages/explorer-ui ci
      - run: node packages/explorer-ui/node_modules/typescript/bin/tsc --noEmit -p packages/explorer-ui/tsconfig.json
      - run: node scripts/check-architecture.mjs
      - run: node scripts/check-i18n.mjs
      - run: node scripts/generate-installer.mjs
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-worker-protocol.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-uninstall-completion.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-login-startup-installer.ps1
      - run: powershell -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File scripts/test-startup-conflict.ps1
      - run: node --test scripts/test-refactor-contracts.mjs scripts/test-plugin-publication.mjs scripts/test-maintenance-isolation.mjs scripts/test-file-mutation-isolation.mjs
      - run: node scripts/test-background-surfaces.mjs
      - run: node scripts/test-login-startup.mjs
